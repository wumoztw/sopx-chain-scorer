name: Weekly SOPX Scoring

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scoring
        env:
          PLURK_CONSUMER_KEY: ${{ secrets.PLURK_CONSUMER_KEY }}
          PLURK_CONSUMER_SECRET: ${{ secrets.PLURK_CONSUMER_SECRET }}
          PLURK_ACCESS_TOKEN: ${{ secrets.PLURK_ACCESS_TOKEN }}
          PLURK_ACCESS_TOKEN_SECRET: ${{ secrets.PLURK_ACCESS_TOKEN_SECRET }}
        run: |
          python sopx_main.py

      - name: Commit reports and dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports docs || true
          git status
          git commit -m "chore: weekly report and dashboard update" || echo "No changes"
          git push
